# carai training defaults

paths:
  manifest: data/manifest.csv
  weights: weights/Cnn14_mAP=0.431.pth
  runs_dir: runs

splits:
  ratios: [0.7, 0.15, 0.15]
  seed: 42

train:
  batch_size: 32
  num_workers: 0           # MPS-safe
  max_epochs: 60
  early_stop_patience: 10  # bumped — first run hit patience too early
  lr_head: 3.0e-4          # bumped 3x
  lr_backbone: 5.0e-5      # bumped 5x — was barely thawing the backbone
  weight_decay: 1.0e-4
  warmup_epochs: 2
  car_loss_weight: 1.0
  state_loss_weight: 0.0   # only car classification matters for v1
