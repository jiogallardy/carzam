# carai training defaults

paths:
  manifest: data/manifest.csv
  weights: weights/Cnn14_mAP=0.431.pth
  runs_dir: runs

splits:
  ratios: [0.7, 0.15, 0.15]
  seed: 42

train:
  batch_size: 32
  num_workers: 0          # MPS-safe
  max_epochs: 50
  early_stop_patience: 5
  lr_head: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  warmup_epochs: 2
  car_loss_weight: 1.0
  state_loss_weight: 1.0
