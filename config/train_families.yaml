# v7: families-as-classes — train on 12 engine families instead of 22 fine classes.
# Same backbone, same data, same augmentations as v6 — but the model only has
# to learn engine families, not specific models within a family.

paths:
  manifest: data/manifest.csv
  weights: weights/Cnn14_mAP=0.431.pth
  runs_dir: runs

splits:
  ratios: [0.7, 0.15, 0.15]
  seed: 42

train:
  batch_size: 32
  num_workers: 0
  max_epochs: 120
  early_stop_patience: 25
  lr_head: 3.0e-4
  lr_backbone: 5.0e-5
  weight_decay: 1.0e-4
  warmup_epochs: 3
  car_loss_weight: 1.0
  state_loss_weight: 0.0
  family_loss_weight: 0.0    # disabled — when use_families_as_classes is true, the car head IS the family head
  use_families_as_classes: true
