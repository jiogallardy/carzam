# Variant B: Variant A + much lower head LR.
# Hypothesis: with 3e-4 the classifier head overfit by epoch 3. Drop to
# 1e-4 to slow it down, letting the embedding head catch up and the
# classifier stay better-calibrated.
paths:
  manifest: data/manifest.csv
  weights: weights/Cnn14_mAP=0.431.pth
  runs_dir: runs

splits:
  ratios: [0.7, 0.15, 0.15]
  seed: 42

train:
  batch_size: 32
  num_workers: 0
  max_epochs: 50
  early_stop_patience: 15
  lr_head: 1.0e-4
  lr_backbone: 3.0e-5
  weight_decay: 1.0e-4
  warmup_epochs: 3
  car_loss_weight: 1.0
  state_loss_weight: 0.0
  family_loss_weight: 0.3

  embedding_dim: 128
  contrastive_loss_weight: 1.0
  contrastive_temperature: 0.20
  n_classes_per_batch: 8
  n_samples_per_class: 4
