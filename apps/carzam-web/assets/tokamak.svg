<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tokamak — 3/4 perspective torus with hot plasma flowing toroidally inside,
  D-shaped poloidal field coils wrapping the vessel, and central solenoid
  glowing along the major axis. Loops cleanly at ~6s.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Hot plasma (core): blue-white → cyan → magenta -->
    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a8d8ff"/>
      <stop offset="60%" stop-color="#5a7fff"/>
      <stop offset="100%" stop-color="#2a1a6e" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer halo: violet → magenta -->
    <radialGradient id="plasmaHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff5ecf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5ecf" stop-opacity="0"/>
    </radialGradient>
    <!-- Vessel metal: gunmetal -->
    <linearGradient id="vessel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#2a2f3e"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <!-- Coil copper -->
    <linearGradient id="coilCu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#b88a4a"/>
      <stop offset="50%" stop-color="#7a4f1a"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
    <!-- Central solenoid glow -->
    <linearGradient id="solenoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffe5a6"/>
      <stop offset="50%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff3d3d"/>
    </linearGradient>

    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloomBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Helical field-line path: a flattened oval. -->
    <path id="fieldLine"
          d="M 600,400 m -380,0 a 380,130 0 1,0 760,0 a 380,130 0 1,0 -760,0" />
  </defs>

  <!-- BACKDROP — soft cosmic glow -->
  <rect width="1200" height="800" fill="#05060c"/>
  <radialGradient id="bg" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#1a1740" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#05060c" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- BACK HALF of the vessel (drawn first so the plasma overlaps it on top) -->
  <ellipse cx="600" cy="400" rx="450" ry="160" fill="none" stroke="url(#vessel)" stroke-width="36" opacity="0.95"/>

  <!-- BACK toroidal field coils — D-shaped magnets behind the plasma -->
  <g opacity="0.85">
    <g transform="translate(280, 400) scale(1, 1.4)"><path d="M 0,-110 Q 70,-110 70,0 Q 70,110 0,110 Q -50,110 -50,0 Q -50,-110 0,-110 Z" fill="none" stroke="url(#coilCu)" stroke-width="14"/></g>
    <g transform="translate(420, 400) scale(1, 1.5)"><path d="M 0,-110 Q 70,-110 70,0 Q 70,110 0,110 Q -50,110 -50,0 Q -50,-110 0,-110 Z" fill="none" stroke="url(#coilCu)" stroke-width="14"/></g>
    <g transform="translate(780, 400) scale(1, 1.5)"><path d="M 0,-110 Q 70,-110 70,0 Q 70,110 0,110 Q -50,110 -50,0 Q -50,-110 0,-110 Z" fill="none" stroke="url(#coilCu)" stroke-width="14"/></g>
    <g transform="translate(920, 400) scale(1, 1.4)"><path d="M 0,-110 Q 70,-110 70,0 Q 70,110 0,110 Q -50,110 -50,0 Q -50,-110 0,-110 Z" fill="none" stroke="url(#coilCu)" stroke-width="14"/></g>
  </g>

  <!-- CENTRAL SOLENOID — vertical glowing bar through the donut hole -->
  <g filter="url(#bloom)">
    <rect x="585" y="200" width="30" height="400" rx="15" fill="url(#solenoid)"/>
    <rect x="585" y="200" width="30" height="400" rx="15" fill="url(#solenoid)" opacity="0.6">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- PLASMA OUTER HALO — pulsing magenta -->
  <ellipse cx="600" cy="400" rx="430" ry="148" fill="url(#plasmaHalo)" filter="url(#bloomBig)">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- PLASMA CORE — the hot inner ring -->
  <ellipse cx="600" cy="400" rx="380" ry="130" fill="url(#plasmaCore)" filter="url(#bloom)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- HELICAL FIELD LINES — particles streaming around the torus -->
  <g filter="url(#bloom)" opacity="0.9">
    <circle r="3" fill="#fff">
      <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#a8d8ff">
      <animateMotion dur="3.2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#ffd9b8">
      <animateMotion dur="3.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#ff5ecf">
      <animateMotion dur="3.2s" begin="-1.2s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#fff">
      <animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#a8d8ff">
      <animateMotion dur="3.2s" begin="-2.0s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#ffd9b8">
      <animateMotion dur="3.2s" begin="-2.4s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
    <circle r="3" fill="#ff5ecf">
      <animateMotion dur="3.2s" begin="-2.8s" repeatCount="indefinite"><mpath href="#fieldLine"/></animateMotion>
    </circle>
  </g>

  <!-- FRONT HALF of the vessel (drawn on top so depth reads correctly) -->
  <path d="M 600,400 m -450,0 a 450,160 0 0,0 900,0" fill="none" stroke="url(#vessel)" stroke-width="36" opacity="0.95"/>

  <!-- FRONT toroidal field coils -->
  <g>
    <g transform="translate(150, 400) scale(1, 1.3)"><path d="M 0,-115 Q 75,-115 75,0 Q 75,115 0,115 Q -55,115 -55,0 Q -55,-115 0,-115 Z" fill="none" stroke="url(#coilCu)" stroke-width="16"/></g>
    <g transform="translate(600, 400) scale(1, 1.6)"><path d="M 0,-115 Q 75,-115 75,0 Q 75,115 0,115 Q -55,115 -55,0 Q -55,-115 0,-115 Z" fill="none" stroke="url(#coilCu)" stroke-width="16"/></g>
    <g transform="translate(1050, 400) scale(1, 1.3)"><path d="M 0,-115 Q 75,-115 75,0 Q 75,115 0,115 Q -55,115 -55,0 Q -55,-115 0,-115 Z" fill="none" stroke="url(#coilCu)" stroke-width="16"/></g>
  </g>

  <!-- VESSEL TICK MARKS — subtle scientific detail -->
  <g stroke="#3a4054" stroke-width="2" opacity="0.7">
    <line x1="150" y1="555" x2="150" y2="575"/>
    <line x1="600" y1="555" x2="600" y2="575"/>
    <line x1="1050" y1="555" x2="1050" y2="575"/>
  </g>
</svg>
