[project]
name = "epd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-multipart>=0.0.9",
    "google-genai>=0.3",
]

[project.scripts]
epd = "epd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epd", "epd.driver"]
package-dir = {"epd" = "."}
